name: anyrouter
on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: anyrouter
      continue-on-error: true
      timeout-minutes: 2
      env:
        COOKIES: "_5X0OD6Pm2Iqh7QBpmg1tOI=,-wx-uuwqL3gL2IBwxwoCM-xtA=="
        TG_BOT_TOKEN: "xxxxxx"
        TG_CHAT_ID: "xxxxx"
      run: |
        node anyrouter.js
